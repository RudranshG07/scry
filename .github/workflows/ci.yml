name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The worker's queries are the part worth testing most and they exist only
    # against a real database. Timescale rather than postgres because migration
    # 002 creates the extension and three hypertables.
    services:
      timescale:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: scry
          POSTGRES_USER: scry
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scry -d scry"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api-go/go.mod
          cache-dependency-path: services/api-go/go.sum
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:observation
      - run: npm run test:forecasting
      - run: npm run test:operations
      - run: npm run test:qualification
      - run: python -m venv services/vision/.venv && services/vision/.venv/bin/pip install numpy opencv-python-headless eth-keys "eth-hash[pycryptodome]"
      - run: npm run test:vision
      - run: npm run test:curation
      - run: npm run test:reputation
      - run: |
          for file in database/migrations/*.sql; do
            psql "$SCRY_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done
        env:
          SCRY_TEST_DATABASE_URL: postgres://scry:ci-only@127.0.0.1:5432/scry?sslmode=disable
      - run: go test ./services/api-go/...
        env:
          SCRY_TEST_DATABASE_URL: postgres://scry:ci-only@127.0.0.1:5432/scry?sslmode=disable
      - run: forge test --root contracts
      - run: docker compose config --quiet
        env:
          SCRY_POSTGRES_PASSWORD: ci-only
      - run: npm audit --audit-level=moderate
      - run: npm run build
        env:
          NEXT_PUBLIC_SCRY_API_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_SCRY_WS_URL: ws://127.0.0.1:8080
