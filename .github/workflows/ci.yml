name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api-go/go.mod
          cache-dependency-path: services/api-go/go.sum
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:observation
      - run: npm run test:forecasting
      - run: npm run test:operations
      - run: npm run test:qualification
      - run: python -m venv services/vision/.venv && services/vision/.venv/bin/pip install numpy opencv-python-headless eth-keys "eth-hash[pycryptodome]"
      - run: npm run test:vision
      - run: npm run test:curation
      - run: npm run test:reputation
      - run: go test ./services/api-go/...
      - run: forge test --root contracts
      - run: docker compose config --quiet
        env:
          SCRY_POSTGRES_PASSWORD: ci-only
      - run: npm audit --audit-level=moderate
      - run: npm run build
        env:
          NEXT_PUBLIC_SCRY_API_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_SCRY_WS_URL: ws://127.0.0.1:8080
