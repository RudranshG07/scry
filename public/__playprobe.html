<!doctype html>
<meta charset="utf-8">
<title>probe:starting</title>
<video id="v" muted autoplay playsinline></video>
<script src="/__hls.js"></script>
<script>
const market = new URLSearchParams(location.search).get("market");
const video = document.getElementById("v");
const say = (text) => { document.title = "probe:" + text; };

let started = 0;
let fatal = "";

fetch("/api/streams/" + encodeURIComponent(market), { cache: "no-store" })
  .then((r) => r.json())
  .then((stream) => {
    say("resolved " + stream.kind);
    if (!window.Hls || !Hls.isSupported()) { say("hls-unsupported"); return; }
    const hls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 30 });
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fatal = d.type + "/" + d.details; });
    hls.loadSource(stream.url);
    hls.attachMedia(video);
    video.play().catch(() => {});
  })
  .catch((e) => say("resolve-failed " + e.message));

setInterval(() => {
  if (fatal) { say("FATAL " + fatal); return; }
  if (video.currentTime > 0 && !started) started = video.currentTime;
  const advanced = video.currentTime - started;
  say(
    (video.currentTime > 0.5 && advanced >= 0 ? "PLAYING" : "waiting") +
    " t=" + video.currentTime.toFixed(2) +
    " ready=" + video.readyState +
    " buffered=" + (video.buffered.length ? video.buffered.end(0).toFixed(1) : "0") +
    " res=" + video.videoWidth + "x" + video.videoHeight
  );
}, 500);
</script>
