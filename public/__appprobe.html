<!doctype html>
<meta charset="utf-8">
<title>app:starting</title>
<body></body>
<script>
localStorage.setItem("scry-experience-v1", JSON.stringify({
  acknowledged: true, ageConfirmed: true, jurisdiction: "IN",
  dailyPositionLimit: 100, sessionReminderMinutes: 30, hidePoolValues: false,
  coolOffUntil: null, reminders: [], forecasts: [],
  profile: { displayName: "probe", specialty: "Traffic" },
  readNotifications: [], reactions: {}
}));

const frame = document.createElement("iframe");
frame.width = 1280; frame.height = 720; frame.src = "/live";
document.body.appendChild(frame);

setInterval(() => {
  let videos = [];
  try {
    videos = Array.from(frame.contentDocument.querySelectorAll("video"));
  } catch (e) {
    document.title = "app:no-access " + e.message;
    return;
  }
  if (videos.length === 0) { document.title = "app:no-video-element"; return; }
  const live = videos.filter((v) => v.currentTime > 0.5 && v.readyState >= 3);
  const best = live[0] || videos[0];
  document.title =
    "app:" + (live.length ? "PLAYING" : "waiting") +
    " videos=" + videos.length + " live=" + live.length +
    " t=" + best.currentTime.toFixed(2) +
    " ready=" + best.readyState +
    " res=" + best.videoWidth + "x" + best.videoHeight +
    " src=" + (best.currentSrc || "hls").slice(0, 28);
}, 500);
</script>
