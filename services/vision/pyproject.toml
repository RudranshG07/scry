[project]
name = "scry-vision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "ultralytics>=8.3",
    "yt-dlp[default]>=2026.8.19",
    "eth-keys>=0.5",
    "eth-hash[pycryptodome]>=0.7",
    "faster-whisper>=1.2",
]

[project.scripts]
scry-vision = "scry_vision.cli:main"

[tool.setuptools]
packages = ["scry_vision"]
