logLevel: info

hls: yes
hlsAddress: :8888
# mpegts and a minute of buffer, not low latency and seven seconds.
#
# An observer reads one path continuously for fifteen minutes. With a 7s window
# any stall drops it off the back and the missing footage shows up as blind
# time: both observers reported uptime around 0.70 against a 0.95 floor while
# the camera itself was fine. Latency does not matter here — nothing settles on
# how fresh the frame is, only on how much of the window was seen.
hlsVariant: mpegts
hlsAlwaysRemux: yes
# Sixty one-second segments, not thirty two-second ones: the same minute of
# buffer with half the jump at each boundary. An observer counts any gap in
# footage over a second as blind time, so two-second segments spent a share of
# every window looking broken — uptime 0.93 against a 0.95 floor on a camera
# that was fine.
hlsSegmentCount: 60
hlsSegmentDuration: 1s
hlsAllowOrigin: "*"

# Enabled for the ingest process only, which publishes to 127.0.0.1 inside the
# container. Nothing outside reaches it: compose maps the HLS and API ports and
# not this one.
rtsp: yes
rtspAddress: 127.0.0.1:8554
rtmp: no
webrtc: yes
webrtcAddress: :8889
srt: no
api: yes
apiAddress: :9997

# The API and the streams are bound to loopback by compose, so the only callers
# are on this machine. Naming the permissions explicitly is still required: with
# no user configured, mediamtx refuses every request including its own health
# check, and the container reports unhealthy while working fine.
authMethod: internal
authInternalUsers:
  - user: any
    permissions:
      - action: api
      - action: read
      - action: publish
      - action: metrics

# One path per stream, pulled once and shared.
#
# Two observers reading the same camera directly open two connections to it and
# each get a different, partial set of frames: measured at 10491 against 5841 over
# the same 893 seconds. They were not disagreeing about traffic, they were
# watching different traffic. Counting the same relayed frames removes that, and
# leaves any remaining disagreement where it belongs — in the detector.
#
# sourceOnDemand stays off for these. On demand, the pull starts when a client
# arrives and stops when it leaves, so every observation window would begin with
# a cold connection during the seconds that matter most.
pathDefaults:
  sourceOnDemand: no
  # Caltrans drops roughly one segment fetch in three from here. Reconnecting is
  # the normal case rather than an error, so it retries quickly and quietly.
  sourceOnDemandStartTimeout: 15s
  sourceOnDemandCloseAfter: 60s

paths:
  # One rule for every camera. The path name is the stream id, and the ingest
  # script asks the API what that stream's source is, so a link submitted an
  # hour ago is relayed without anyone editing this file. Cameras rotate — half
  # of the first four died within a day — and a config listing them by hand goes
  # stale faster than anyone will maintain it.
  "~^stream-[a-z0-9-]+$":
    runOnDemand: /usr/local/bin/ingest $MTX_PATH
    runOnDemandRestart: yes
    # Long enough to cover the gap between one observation window closing and
    # the next opening, so the pull is warm when counting starts rather than
    # reconnecting during the seconds that matter most.
    runOnDemandStartTimeout: 30s
    runOnDemandCloseAfter: 5m
