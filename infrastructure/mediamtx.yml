logLevel: info

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsAlwaysRemux: yes
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsAllowOrigin: "*"

rtsp: no
rtmp: no
webrtc: yes
webrtcAddress: :8889
srt: no
api: yes
apiAddress: :9997

# One path per market id. The browser only ever requests
# <origin>/<marketId>/index.m3u8, so a source failing, changing or being
# replaced never reaches the client — mediamtx reconnects behind the path.
pathDefaults:
  sourceOnDemand: yes
  sourceOnDemandStartTimeout: 15s
  sourceOnDemandCloseAfter: 60s

paths:
  long-beach-710:
    source: https://wzmedia.dot.ca.gov/D7/CCTV-262.stream/playlist.m3u8

  los-angeles-405:
    source: https://wzmedia.dot.ca.gov/D11/C023_SB_5_JNO_28th_St.stream/playlist.m3u8

  santa-monica-10:
    source: https://wzmedia.dot.ca.gov/D11/C006_EB_8_JEO_Taylor.stream/playlist.m3u8
