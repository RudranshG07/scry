name: scry

services:
  timescale:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: scry
      POSTGRES_USER: scry
      POSTGRES_PASSWORD: ${SCRY_POSTGRES_PASSWORD:?SCRY_POSTGRES_PASSWORD is required}
    ports:
      - 127.0.0.1:${SCRY_POSTGRES_PORT:-5432}:5432
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U scry -d scry]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, allkeys-lru]
    ports:
      - 127.0.0.1:${SCRY_REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: [-c, /etc/nats/nats.conf]
    ports:
      - 127.0.0.1:${SCRY_NATS_PORT:-4222}:4222
      - 127.0.0.1:${SCRY_NATS_MONITOR_PORT:-8222}:8222
    volumes:
      - ./infrastructure/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data

  # Republishes every camera from an origin Scry controls, so the browser never
  # depends on a third-party CDN being reachable. Set SCRY_MEDIA_ORIGIN to
  # http://127.0.0.1:8888 to make the stream resolver prefer it.
  mediamtx:
    # Built rather than pulled: the stock image can ingest a playlist but not a
    # watch page, and every camera here arrives as the latter. The base is the
    # ffmpeg variant because the plain one carries no CA bundle and fails
    # certificate verification on every https source.
    build:
      context: ./infrastructure/relay
    restart: unless-stopped
    ports:
      - 127.0.0.1:${SCRY_HLS_PORT:-8888}:8888
      - 127.0.0.1:${SCRY_WEBRTC_PORT:-8889}:8889
      - 127.0.0.1:${SCRY_MEDIA_API_PORT:-9997}:9997
    environment:
      # Where the ingest script asks which source a stream id belongs to.
      SCRY_API: ${SCRY_RELAY_API:-http://host.docker.internal:8080}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./infrastructure/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: [CMD-SHELL, "wget -q -O- http://127.0.0.1:9997/v3/paths/list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  timescale-data:
  redis-data:
  nats-data:
